ShortDescription: Hybrid Windows 11 utility for detecting White vs Gray (CGNAT) IPs, 1-click UPnP router port forwarding, and self-hosted game servers.
Description: |
  NetHub is a developer and gamer network utility designed for Windows 11.
  It enables instant White vs Gray (CGNAT) IP detection, automated 1-click UPnP router port forwarding
  without administrative router credentials, external WAN accessibility testing, and remote process
  dispatching via a built-in FastAPI web dashboard.
